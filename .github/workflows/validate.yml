name: Validate toolkit
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validator and installer tests
        run: python -m unittest discover -s tests
      - name: Validate structure, routing and paths
        run: python scripts/validate_toolkit.py
      - name: Installer smoke test
        run: |
          mkdir -p "$RUNNER_TEMP/demo"
          python scripts/install.py "$RUNNER_TEMP/demo" --client copilot --collection all
          test -f "$RUNNER_TEMP/demo/.agents/RULES.md"
