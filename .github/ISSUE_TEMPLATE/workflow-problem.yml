name: Workflow problem
description: A skill, profile or prompt gave a wrong, unsafe or unhelpful result.
labels: [workflow-problem]
body:
  - type: markdown
    attributes:
      value: Use sanitized code, diffs and logs. Do not include credentials, internal hosts or personal data.
  - type: input
    id: workflow
    attributes:
      label: Skill, profile or prompt
      placeholder: .agents/skills/drupal-log-analysis/SKILL.md
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: Client and version
      placeholder: Claude Code 2.x, Codex, VS Code Copilot ...
    validations:
      required: true
  - type: textarea
    id: task
    attributes:
      label: Task you asked for
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed result
      description: What the assistant did or concluded, and the evidence it had.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Desired behavior
    validations:
      required: true
